name: CI

# Python 3.14 everywhere: it is the interpreter the committed artefacts were
# generated with. requirements.txt, requirements-dev.txt and the Dockerfile pin
# the same version and tests/test_python_pin.py fails if they drift apart.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 03:17 UTC. The full pipeline re-run lives here rather than on
    # every PR because it takes about twenty minutes.
    #
    # Cross-platform bit-for-bit reproduction is not merely unproven, it is now
    # DISPROVEN, and the numbers are on record: a 2-vCPU Linux runner reproduced
    # 45,268 dispatch instants where the reference platform records 45,432, and 26
    # artefacts differed in their low decimals. The cause is XGBoost's parallel
    # histogram build, whose float reduction order depends on thread count and
    # library build; the fitted model drives dispatch decisions, so one
    # perturbation reaches every downstream count. The same run reproduced ZERO
    # violations, which is the claim.
    #
    # So this job runs --expect claims: digit differences are reported as DRIFT and
    # the verdict comes from tools/verify_claims.py. Digit-exactness is verified on
    # the reference platform, by `make verify`, and pinned by
    # tests/test_golden_numbers.py.
    - cron: '17 3 * * 1'
  workflow_dispatch:

jobs:
  test:
    name: Lint, tests, smoke verification
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      # No continue-on-error: a dependency set that does not install is a
      # broken build, not a warning.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile every Python file
        run: >
          python -m compileall -q
          01_simulation 02_data 03_models 04_scheduler 05_results phases_22_30
          dashboard.py vizstyle.py conftest.py tools tests

      # Selection (E9,F63,F7,F82) comes from pyproject.toml; do not repeat it
      # here, or the two definitions will disagree.
      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest

      # SMOKE=1 pipeline in a scratch copy: proves every artefact is still
      # produced by a script and that the CSV schemas have not moved. Values are
      # reduced in a smoke run, so they are not compared.
      - name: Smoke verification of artefacts
        run: python tools/verify_artifacts.py --smoke --report smoke_report.md

      # Fast, and independent of the pipeline: does the COMMITTED tree support the
      # statements the repository makes? Runs on every PR because it takes seconds
      # and because a claim that stopped holding is the most serious defect here.
      - name: Verify the claims against the committed artefacts
        run: python tools/verify_claims.py --report claims_report.md

      - name: Upload smoke and claim reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            smoke_report.md
            claims_report.md

  verify-full:
    name: Full artefact reproduction (scheduled)
    # Scheduled and manual only -- see the cron comment above for why this is
    # not a per-PR gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # --source HEAD: reproduce what is committed, not a dirty checkout.
      # --expect claims: see the cron comment. This asks the question this runner
      # can actually answer -- do the regenerated artefacts still support the
      # repository's claims -- instead of one it cannot.
      - name: Re-run the pipeline and check every claim against it
        run: >
          python tools/verify_artifacts.py --source HEAD --expect claims
          --report verify_report.md

      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: verify_report.md
