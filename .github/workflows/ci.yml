name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Syntax & lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all Python (syntax check)
        run: python -m compileall -q 01_simulation 02_data 03_models 04_scheduler 05_results phases_22_30 dashboard.py

      - name: Lint for fatal errors (ruff)
        run: |
          pip install ruff
          # Fail only on real errors: syntax (E9) and undefined/invalid names (F63, F7, F82).
          ruff check --select E9,F63,F7,F82 .

  requirements:
    name: requirements.txt resolves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dry-run dependency resolution
        run: python -m pip install --dry-run -r requirements.txt
        continue-on-error: true
